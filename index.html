<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafletJS</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Initialize map
        var map = L.map('map').setView([-7.7956, 110.3695], 13);

        // Tile Layer Base Map
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        var Esri_WorldImagery = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
                attribution:
                    'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
            }
        );

        var rupabumiindonesia = L.tileLayer(
            'https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}',
            {
                attribution: 'Badan Informasi Geospasial'
            }
        );

        var OpenTopoMap = L.tileLayer(
            'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 17,
                attribution:
                    'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, ' +
                    '<a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; ' +
                    '<a href="https://opentopomap.org">OpenTopoMap</a> ' +
                    '(<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
            }
        );

        // Menambahkan basemap ke dalam peta
        osm.addTo(map);

        // Marker
        var marker = L.marker([-7.7956, 110.3695]);
        var marker2 = L.marker([-7.4246, 109.2396]);
        var marker3 = L.marker([-7.451405475682718, 109.50398223295518]);

        // Menambahkan marker ke dalam peta
        marker.addTo(map);
        marker2.addTo(map);
        marker3.addTo(map);

        // Popup
        marker.bindPopup("<b>Yogyakarta</b><br>Yogyakarta merupakan salah satu kota di Pulau Jawa yang dikenal sebagai kota budaya dan pendidikan. Yogyakarta memiliki berbagai peninggalan sejarah, kesenian, kuliner, serta destinasi wisata yang menarik untuk dikunjungi.");

        marker2.bindPopup("<b>Purwokerto</b><br>Purwokerto merupakan ibu kota Kabupaten Banyumas yang terletak di Jawa Tengah. Kota ini dikenal sebagai salah satu pusat pendidikan, perdagangan, dan kegiatan ekonomi di wilayah Banyumas serta menjadi daerah yang dekat dengan kawasan wisata Gunung Slamet dan Baturraden.");

        marker3.bindPopup("<b>Rumah Ajeng Comel</b><br>Rumah Ajeng Comel merupakan tempat tinggal yang nyaman dan menjadi tempat beristirahat setelah menjalani berbagai aktivitas sehari-hari. Rumah ini juga menjadi tempat berkumpul bersama keluarga serta menyimpan banyak cerita dan kenangan.");
        //marker.openPopup();

        // Tooltip
        marker.bindTooltip("Kota Yogyakarta");
        marker2.bindTooltip("Kota Purwokerto");
        marker3.bindTooltip("Rumah Ajeng Comel");
        //marker.openTooltip();

        // Circle
        var circle = L.circle([-7.455, 110.440], {
            color: "red", // warna garis
            opacity: 1, // opacity garis
            fillColor: "#f03", // warna fill
            fillOpacity: 0.5, // opacity fill
            radius: 5000, // radius dalam meter
        });

        // Menambahkan circle ke dalam peta
        circle.addTo(map);

        // Popup
        circle.bindPopup("<b>Gn. Merbabu</b><br>Gunung Merbabu merupakan gunung api yang terletak di Jawa Tengah dan dikenal sebagai salah satu destinasi pendakian yang populer. Gunung ini memiliki pemandangan alam yang indah, terutama hamparan sabana dan panorama pegunungan di sekitarnya.");
        //circle.openPopup();

        // Tooltip
        circle.bindTooltip("Gunung Merbabu", { sticky: true });
        //circle.openTooltip();

        // Polyline
        var vertexPolyline = [
            [-7.7956, 110.3695],
            [-7.4246, 109.2396],
            [-7.451405475682718, 109.50398223295518],
        ];

        var polyline = L.polyline(vertexPolyline, {
            color: "red", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
        });

        // Menambahkan polyline ke dalam peta
        polyline.addTo(map);

        // Popup
        polyline.bindPopup("<b>Jalur Yogyakarta - Purwokerto - Rumah Ajeng</b><br>Garis ini menghubungkan lokasi Yogyakarta, Purwokerto, dan Rumah Ajeng.");

        // Tooltip
        polyline.bindTooltip("Jalur Yogyakarta - Purwokerto - Rumah Ajeng", { sticky: true });
        //polyline.openTooltip();

        // Polygon
        var vertexPolygon = [
            [-7.7956, 110.3695],
            [-7.4246, 109.2396],
            [-7.451405475682718, 109.50398223295518],
            [-7.455, 110.440]
        ];

        var polygon = L.polygon(vertexPolygon, {
            color: "purple", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
            fillColor: "#0f3", // warna fill
            fillOpacity: 0.5, // opacity fill
        });

        // Menambahkan polygon ke dalam peta
        polygon.addTo(map);

        // Popup
        polygon.bindPopup("<b>Area Yogyakarta - Purwokerto - Merbabu</b><br>Polygon menunjukkan area yang dibentuk berdasarkan beberapa titik lokasi pada peta.");

        // Tooltip
        polygon.bindTooltip("Area Yogyakarta - Purwokerto - Merbabu", { sticky: true });
        //polygon.openTooltip();

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri World Imagery": Esri_WorldImagery,
            "Rupa Bumi Indonesia": rupabumiindonesia,
            "Open Topo Map": OpenTopoMap,
        };

        var overlayMaps = {
            "Yogyakarta": marker,
            "Purwokerto": marker2,
            "Rumah Ajeng": marker3,
            "Merbabu": circle,
            "Line": polyline,
            "Polygon": polygon
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps);
        controllayer.addTo(map);

        // Scale
        var scale = L.control.scale();
        scale.addTo(map);

        // Geolocation
        map.locate({
            setView: true,
            maxZoom: 16,
        });

        // Fungsi untuk menampilkan lokasi
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            // Menampilkan marker pada lokasi 
            L.marker(e.latlng).addTo(map).bindPopup("Anda berada dalam radius " + radius + " meter dari titik ini").openPopup();

            // Menampilkan circle pada lokasi
            L.circle(e.latlng, radius).addTo(map);
        }

        map.on("locationfound", onLocationFound);

        // Fungsi untuk menampilkan pesan error
        function onLocationError(e) {
            alert(e.message);
        }

        map.on("locationerror", onLocationError);

    </script>

</body>

</html>
